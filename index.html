
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Archive</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #07090d;
            color: white;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background:
                radial-gradient(circle at top, #17345b, transparent 65%),
                #07090d;
            padding: 40px 20px;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            background: linear-gradient(90deg, #ffffff, #4da3ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }

        .hero p {
            color: #aab4c3;
            font-size: 1.2rem;
        }

        .scroll-button {
            margin-top: 35px;
            padding: 13px 28px;
            border-radius: 30px;
            background: #2678d9;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .scroll-button:hover {
            background: #4598ff;
            transform: translateY(-3px);
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 70px 25px;
        }

        .section {
            margin-bottom: 90px;
        }

        .section-header {
            margin-bottom: 35px;
        }

        .section-header h2 {
            font-size: 2.3rem;
            margin-bottom: 10px;
        }

        .section-header p {
            color: #8995a5;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: white;
            background: #111722;
            border: 1px solid #202b3b;
            border-radius: 15px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #398fff;
            box-shadow: 0 10px 30px #0008;
        }

        .card-image {
            height: 260px;
            overflow: hidden;
        }

        .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .card:hover .card-image img {
            transform: scale(1.06);
        }

        .card-divider {
            height: 1px;
            background: #263449;
        }

        .card-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .card-content h3 {
            font-size: 1.25rem;
        }

        .card-arrow {
            color: #4da3ff;
            font-size: 1.5rem;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #202b3b;
            color: #758195;
        }

        .reveal {
            opacity: 0;
            transform: translateY(25px);
            transition: 0.7s;
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 800px) {
            main {
                padding: 50px 20px;
            }

            .section-header h2 {
                font-size: 2rem;
            }
        }

        @media (max-width: 450px) {
            .hero p {
                font-size: 1rem;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header class="hero">
        <h1>Football Archive</h1>
        <p>The careers. The stories. The legends.</p>
        <a href="#managers" class="scroll-button">Explore Archive ↓</a>
    </header>

    <main>

        <!-- MANAGERS -->

        <section class="section reveal" id="managers">

            <div class="section-header">
                <h2>Managers</h2>
                <p>Discover the greatest football managers.</p>
            </div>

            <div class="cards">

                <a href="https://ofer1264012640-sys.github.io/Pep-Guardiola/" class="card">
                    <div class="card-image">
                        <img src="images/pep-guardiola.jpg" alt="Pep Guardiola">
                    </div>

                    <div class="card-divider"></div>

                    <div class="card-content">
                        <h3>Pep Guardiola</h3>
                        <span class="card-arrow">↗</span>
                    </div>
                </a>

                <a href="https://ofer1264012640-sys.github.io/jose-mourinho/index.html" class="card">
                    <div class="card-image">
                        <img src="images/jose-mourinho.jpg" alt="Jose Mourinho">
                    </div>

                    <div class="card-divider"></div>

                    <div class="card-content">
                        <h3>José Mourinho</h3>
                        <span class="card-arrow">↗</span>
                    </div>
                </a>

            </div>
        </section>


        <!-- PLAYERS -->

        <section class="section reveal" id="players">

            <div class="section-header">
                <h2>Players</h2>
                <p>Discover the greatest football players.</p>
            </div>

            <div class="cards">

                <a href="MESSI_WEBSITE_URL" class="card">
                    <div class="card-image">
                        <img src="images/lionel-messi.jpg" alt="Lionel Messi">
                    </div>

                    <div class="card-divider"></div>

                    <div class="card-content">
                        <h3>Lionel Messi</h3>
                        <span class="card-arrow">↗</span>
                    </div>
                </a>

            </div>
        </section>

    </main>

    <footer>
        © 2026 Football Archive
    </footer>

    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("visible");
                }
            });
        });

        document.querySelectorAll(".reveal").forEach(element => {
            observer.observe(element);
        });
    </script>

</body>
</html>
